<!doctype html><html lang="en">
  <head>
        <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
       <title>Sign Up | MemoryLane</title>
  </head>
<body>
 <nav class="navbar main-nav">
    <div class="container">
        <a class="navbar-brand brand" href="index.html">
            <span class="brand-symbol">❧</span> MemoryLane</a>
            <a href="index.html" class="nav-link">Back to Home</a>
        </div>
    </nav>
<main class="account-area">
    <section class="account-card">
        <div class="text-center mb-4">
<div class="account-logo">
    <span class="brand-symbol">❧</span> MemoryLane
</div>
<p class="small-heading">START YOUR PERSONAL ARCHIVE</p>
<h1 class="section-title">Create an Account</h1>
<p class="form-intro">Your memories deserve a home. Let's make one.</p>
</div>
<form onsubmit="event.preventDefault(); window.location.href='user-home.html';">
<div class="mb-3">
    <label class="form-label" for="name">Full Name</label>
    <input class="form-control" type="text" id="name" 
    placeholder="Enter your full name" required></div>
<div class="mb-3">
    <label class="form-label" for="email">Email Address</label>
    <input class="form-control" type="email" id="email" 
    placeholder="Enter your email" required>
</div>
<div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" type="password" id="password" 
    placeholder="Create a password" minlength="6" required>
</div>
<div class="mb-4">
    <label class="form-label" for="confirmPassword">Confirm Password</label>
    <input class="form-control" type="password" id="confirmPassword" 
    placeholder="Enter password again" minlength="6" required>
</div>
<button type="submit" class="btn btn-terracotta w-100">Create My Account</button>
</form>
<p class="text-center mt-4 mb-0 small">Already have an account? <a href="login.html" class="form-link fw-semibold">Login</a></p>
<p class="demo-note text-center mt-3 mb-0">Static demo: this form opens the sample user dashboard.</p>
</section>
  </main>
   </body>
</html>
