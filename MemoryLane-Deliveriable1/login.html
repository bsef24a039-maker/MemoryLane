<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Login | MemoryLane</title></head><body>
<nav class="navbar main-nav"><div class="container"><a class="navbar-brand brand" 
    href="index.html"><span class="brand-symbol">❧</span> MemoryLane</a>
    <a href="index.html" class="nav-link">Back to Home</a></div></nav>
<main class="account-area"><section class="account-card">
    <div class="text-center mb-4">
<div class="account-logo"><span class="brand-symbol">❧</span> MemoryLane
</div>
<p class="small-heading">YOUR STORIES ARE WAITING</p><h1 class="section-title">Welcome Back</h1>
<p class="form-intro">Sign in and return to your favourite moments.</p>
</div>
<form onsubmit="event.preventDefault(); window.location.href='user-home.html';">
<div class="mb-3"><label class="form-label" for="email">Email Address</label>
    <input class="form-control" type="email" id="email"
     placeholder="Enter your email" required>
</div>
<div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" type="password" id="password" 
    placeholder="Enter your password" required></div>
<div class="d-flex justify-content-between align-items-center mb-4">
    <div class="form-check"><input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
    </div>
    <a href="#" class="form-link small">Forgot password?</a>
</div>
<button type="submit" class="btn btn-terracotta w-100">Login to MemoryLane</button>
</form>
 <p class="text-center mt-4 mb-0 small">New to MemoryLane? <a href="signup.html" class="form-link fw-semibold">Create an account</a></p><p class="demo-note text-center mt-3 mb-0">Static demo: this form opens the sample user dashboard.</p>
      </section>
     </main>
  </body>
</html>
